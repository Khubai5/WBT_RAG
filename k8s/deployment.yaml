apiVersion: apps/v1
kind: Deployment
metadata:
  name: wbt-rag
  namespace: wbt-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wbt-rag
  template:
    metadata:
      labels:
        app: wbt-rag
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wbt-rag
          image: wbt-rag:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wbt-rag-secrets
                  key: GROQ_API_KEY
            - name: PORT
              value: "8501"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
